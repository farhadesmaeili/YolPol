name: yolpol-staging

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "${YOLPOL_STAGING_LOG_MAX_SIZE:-10m}"
    max-file: "${YOLPOL_STAGING_LOG_MAX_FILES:-3}"

x-application-environment: &application-environment
  NODE_ENV: production
  YOLPOL_DEPLOYMENT_ENVIRONMENT: staging
  YOLPOL_APP_ORIGIN: https://staging.yolpol.com
  YOLPOL_GIT_REVISION: "${YOLPOL_GIT_REVISION:?Set YOLPOL_GIT_REVISION to the deployed Git SHA}"
  YOLPOL_LOG_LEVEL: info

x-backup-operation: &backup-operation
  image: "${YOLPOL_BACKUP_RESTORE_IMAGE:-yolpol-backup-restore:local}"
  build:
    context: ../..
    dockerfile: Dockerfile
    target: operations-runtime
  restart: "no"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  mem_limit: "${YOLPOL_STAGING_OPERATIONS_MEMORY_LIMIT:-512m}"
  cpus: "${YOLPOL_STAGING_OPERATIONS_CPU_LIMIT:-0.50}"
  pids_limit: 100
  logging: *json-logging

services:
  edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${YOLPOL_STAGING_BIND_ADDRESS:-0.0.0.0}:${YOLPOL_STAGING_HTTP_PORT:-80}:80"
      - "${YOLPOL_STAGING_BIND_ADDRESS:-0.0.0.0}:${YOLPOL_STAGING_HTTPS_PORT:-443}:443"
      - "${YOLPOL_STAGING_BIND_ADDRESS:-0.0.0.0}:${YOLPOL_STAGING_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    mem_limit: "${YOLPOL_STAGING_CADDY_MEMORY_LIMIT:-256m}"
    cpus: "${YOLPOL_STAGING_CADDY_CPU_LIMIT:-0.20}"
    pids_limit: 100
    logging: *json-logging

  web:
    image: "${YOLPOL_WEB_IMAGE:-yolpol-web:local}"
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    restart: "on-failure:5"
    env_file:
      - "${YOLPOL_STAGING_DATABASE_ENV_FILE:?Set YOLPOL_STAGING_DATABASE_ENV_FILE}"
    environment:
      <<: *application-environment
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: "${YOLPOL_STAGING_TELEGRAM_BOT_USERNAME:-}"
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_WEBHOOK_SECRET_FILE: /run/secrets/telegram_webhook_secret
    secrets:
      - telegram_bot_token
      - telegram_webhook_secret
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s
    networks:
      - edge
      - backend
    mem_limit: "${YOLPOL_STAGING_WEB_MEMORY_LIMIT:-768m}"
    cpus: "${YOLPOL_STAGING_WEB_CPU_LIMIT:-0.75}"
    pids_limit: 200
    logging: *json-logging

  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    env_file:
      - "${YOLPOL_STAGING_POSTGRES_ENV_FILE:?Set YOLPOL_STAGING_POSTGRES_ENV_FILE}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s
    networks:
      - backend
    mem_limit: "${YOLPOL_STAGING_POSTGRES_MEMORY_LIMIT:-1g}"
    cpus: "${YOLPOL_STAGING_POSTGRES_CPU_LIMIT:-0.75}"
    pids_limit: 200
    logging: *json-logging

  inquiry-notifications:
    image: "${YOLPOL_WORKER_IMAGE:-yolpol-worker:local}"
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker-runtime
    command: ["node", "--conditions=react-server", "--import", "tsx", "tooling/workers/inquiry-notifications.ts"]
    restart: "on-failure:5"
    env_file:
      - "${YOLPOL_STAGING_DATABASE_ENV_FILE:?Set YOLPOL_STAGING_DATABASE_ENV_FILE}"
    environment:
      <<: *application-environment
      INQUIRY_NOTIFICATION_WORKER_POLL_MS: "${INQUIRY_NOTIFICATION_WORKER_POLL_MS:-2000}"
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
    secrets:
      - telegram_bot_token
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: "${YOLPOL_STAGING_WORKER_STOP_GRACE_PERIOD:-90s}"
    networks:
      - backend
      - provider_egress
    mem_limit: "${YOLPOL_STAGING_WORKER_MEMORY_LIMIT:-384m}"
    cpus: "${YOLPOL_STAGING_WORKER_CPU_LIMIT:-0.25}"
    pids_limit: 150
    logging: *json-logging

  conversation-translation:
    image: "${YOLPOL_WORKER_IMAGE:-yolpol-worker:local}"
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker-runtime
    command: ["node", "--conditions=react-server", "--import", "tsx", "tooling/workers/conversation-translation.ts"]
    restart: "on-failure:5"
    env_file:
      - "${YOLPOL_STAGING_DATABASE_ENV_FILE:?Set YOLPOL_STAGING_DATABASE_ENV_FILE}"
    environment:
      <<: *application-environment
      CONVERSATION_TRANSLATION_WORKER_POLL_MS: "${CONVERSATION_TRANSLATION_WORKER_POLL_MS:-2000}"
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
      YOLPOL_AI_AUTOMATION_EMERGENCY_DISABLED: "${YOLPOL_AI_AUTOMATION_EMERGENCY_DISABLED:-false}"
    secrets:
      - groq_api_key
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: "${YOLPOL_STAGING_WORKER_STOP_GRACE_PERIOD:-90s}"
    networks:
      - backend
      - provider_egress
    mem_limit: "${YOLPOL_STAGING_WORKER_MEMORY_LIMIT:-384m}"
    cpus: "${YOLPOL_STAGING_WORKER_CPU_LIMIT:-0.25}"
    pids_limit: 150
    logging: *json-logging

  conversation-ai-fallback:
    image: "${YOLPOL_WORKER_IMAGE:-yolpol-worker:local}"
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker-runtime
    command: ["node", "--conditions=react-server", "--import", "tsx", "tooling/workers/conversation-ai-fallback.ts"]
    restart: "on-failure:5"
    env_file:
      - "${YOLPOL_STAGING_DATABASE_ENV_FILE:?Set YOLPOL_STAGING_DATABASE_ENV_FILE}"
    environment:
      <<: *application-environment
      CONVERSATION_AI_FALLBACK_WORKER_POLL_MS: "${CONVERSATION_AI_FALLBACK_WORKER_POLL_MS:-2000}"
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
      YOLPOL_AI_AUTOMATION_EMERGENCY_DISABLED: "${YOLPOL_AI_AUTOMATION_EMERGENCY_DISABLED:-false}"
    secrets:
      - groq_api_key
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: "${YOLPOL_STAGING_WORKER_STOP_GRACE_PERIOD:-90s}"
    networks:
      - backend
      - provider_egress
    mem_limit: "${YOLPOL_STAGING_WORKER_MEMORY_LIMIT:-384m}"
    cpus: "${YOLPOL_STAGING_WORKER_CPU_LIMIT:-0.25}"
    pids_limit: 150
    logging: *json-logging

  migrate:
    profiles: ["migration"]
    image: "${YOLPOL_MIGRATION_IMAGE:-yolpol-migration:local}"
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migration-runtime
    restart: "no"
    env_file:
      - "${YOLPOL_STAGING_MIGRATION_ENV_FILE:?Set YOLPOL_STAGING_MIGRATION_ENV_FILE}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    mem_limit: "${YOLPOL_STAGING_MIGRATION_MEMORY_LIMIT:-512m}"
    cpus: "${YOLPOL_STAGING_MIGRATION_CPU_LIMIT:-0.50}"
    pids_limit: 100
    logging: *json-logging

  backup-create:
    <<: *backup-operation
    profiles: ["backup"]
    restart: "no"
    command: ["create"]
    env_file:
      - path: "${YOLPOL_STAGING_BACKUP_DATABASE_ENV_FILE:?Set YOLPOL_STAGING_BACKUP_DATABASE_ENV_FILE}"
        required: false
    environment:
      YOLPOL_BACKUP_DIRECTORY: /backups
      YOLPOL_DEPLOYMENT_ENVIRONMENT: staging
      YOLPOL_GIT_REVISION: "${YOLPOL_GIT_REVISION:?Set YOLPOL_GIT_REVISION to the deployed Git SHA}"
      YOLPOL_BACKUP_AGE_RECIPIENT: "${YOLPOL_STAGING_BACKUP_AGE_RECIPIENT:-}"
    volumes:
      - type: bind
        source: "${YOLPOL_STAGING_BACKUP_DIRECTORY:-/opt/yolpol/staging/backups}"
        target: /backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  backup-verify:
    <<: *backup-operation
    profiles: ["backup"]
    restart: "no"
    command: ["help"]
    environment:
      YOLPOL_BACKUP_DIRECTORY: /backups
    volumes:
      - type: bind
        source: "${YOLPOL_STAGING_BACKUP_DIRECTORY:-/opt/yolpol/staging/backups}"
        target: /backups
        read_only: true
    network_mode: none

  backup-deep-verify:
    <<: *backup-operation
    profiles: ["backup"]
    restart: "no"
    command: ["help"]
    environment:
      YOLPOL_BACKUP_DIRECTORY: /backups
      YOLPOL_BACKUP_AGE_IDENTITY_FILE: /run/secrets/backup_age_identity
    secrets:
      - backup_age_identity
    volumes:
      - type: bind
        source: "${YOLPOL_STAGING_BACKUP_DIRECTORY:-/opt/yolpol/staging/backups}"
        target: /backups
        read_only: true
    network_mode: none

  backup-retention:
    <<: *backup-operation
    profiles: ["backup"]
    restart: "no"
    command: ["prune"]
    environment:
      YOLPOL_BACKUP_DIRECTORY: /backups
      YOLPOL_DEPLOYMENT_ENVIRONMENT: staging
      YOLPOL_BACKUP_RETENTION_COUNT: "${YOLPOL_STAGING_BACKUP_RETENTION_COUNT:-14}"
    volumes:
      - type: bind
        source: "${YOLPOL_STAGING_BACKUP_DIRECTORY:-/opt/yolpol/staging/backups}"
        target: /backups
    network_mode: none

  restore:
    <<: *backup-operation
    profiles: ["restore"]
    restart: "no"
    command: ["help"]
    env_file:
      - path: "${YOLPOL_STAGING_RESTORE_DATABASE_ENV_FILE:?Set YOLPOL_STAGING_RESTORE_DATABASE_ENV_FILE}"
        required: false
    environment:
      YOLPOL_BACKUP_DIRECTORY: /backups
      YOLPOL_BACKUP_AGE_IDENTITY_FILE: /run/secrets/backup_age_identity
    secrets:
      - backup_age_identity
    volumes:
      - type: bind
        source: "${YOLPOL_STAGING_BACKUP_DIRECTORY:-/opt/yolpol/staging/backups}"
        target: /backups
        read_only: true
    networks:
      - backend

networks:
  edge:
  backend:
    internal: true
  provider_egress:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  telegram_bot_token:
    file: "${YOLPOL_STAGING_TELEGRAM_BOT_TOKEN_FILE:?Set YOLPOL_STAGING_TELEGRAM_BOT_TOKEN_FILE}"
  telegram_webhook_secret:
    file: "${YOLPOL_STAGING_TELEGRAM_WEBHOOK_SECRET_FILE:?Set YOLPOL_STAGING_TELEGRAM_WEBHOOK_SECRET_FILE}"
  groq_api_key:
    file: "${YOLPOL_STAGING_GROQ_API_KEY_FILE:?Set YOLPOL_STAGING_GROQ_API_KEY_FILE}"
  backup_age_identity:
    file: "${YOLPOL_STAGING_BACKUP_AGE_IDENTITY_FILE:?Set YOLPOL_STAGING_BACKUP_AGE_IDENTITY_FILE}"
