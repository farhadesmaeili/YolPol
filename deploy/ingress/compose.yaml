name: yolpol-ingress

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "${YOLPOL_INGRESS_LOG_MAX_SIZE:-10m}"
    max-file: "${YOLPOL_INGRESS_LOG_MAX_FILES:-3}"

services:
  ingress:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - staging_ingress
      - production_ingress
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: "${YOLPOL_INGRESS_CADDY_MEMORY_LIMIT:-256m}"
    cpus: "${YOLPOL_INGRESS_CADDY_CPU_LIMIT:-0.20}"
    pids_limit: 100
    logging: *json-logging

networks:
  staging_ingress:
    name: yolpol-staging-ingress
    external: true
  production_ingress:
    name: yolpol-production-ingress
    external: true

volumes:
  caddy_data:
  caddy_config:
