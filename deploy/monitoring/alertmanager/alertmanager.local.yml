route:
  receiver: local-null
  group_by: [alertname, environment, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: local-null
      matchers:
        - severity="critical"
      repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [environment, service, category]
  - source_matchers:
      - alertname="YolpolWebLivenessUnavailable"
    target_matchers:
      - alertname="YolpolWebReadinessUnavailable"
    equal: [environment, service]
  - source_matchers:
      - alertname="YolpolPostgresExporterDown"
    target_matchers:
      - alertname=~"YolpolOperationsExporterDown|PrometheusTargetScrapeFailing"
    equal: [environment]

receivers:
  - name: local-null
