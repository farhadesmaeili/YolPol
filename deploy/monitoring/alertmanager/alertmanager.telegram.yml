route:
  receiver: ops-telegram
  group_by: [alertname, environment, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: ops-telegram
      matchers:
        - severity="critical"
      repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [environment, service, category]
  - source_matchers:
      - alertname="YolpolWebLivenessUnavailable"
    target_matchers:
      - alertname="YolpolWebReadinessUnavailable"
    equal: [environment, service]
  - source_matchers:
      - alertname="YolpolPostgresExporterDown"
    target_matchers:
      - alertname=~"YolpolOperationsExporterDown|PrometheusTargetScrapeFailing"
    equal: [environment]

receivers:
  - name: ops-telegram
    telegram_configs:
      - bot_token_file: /run/secrets/alert_telegram_bot_token
        chat_id_file: /run/secrets/alert_telegram_chat_id
        send_resolved: true
        parse_mode: ""
        message: |-
          {{ .Status | toUpper }} {{ .CommonLabels.alertname }}
          environment={{ .CommonLabels.environment }} service={{ .CommonLabels.service }} severity={{ .CommonLabels.severity }}
          {{ .CommonAnnotations.summary }}
