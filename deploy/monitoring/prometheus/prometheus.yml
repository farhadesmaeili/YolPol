global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitoring_instance: yolpol-primary

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          environment: monitoring
          service: prometheus

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          environment: monitoring
          service: alertmanager

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          environment: host
          service: linux-host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          environment: host
          service: docker

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          environment: staging
          service: postgres

  - job_name: operations
    static_configs:
      - targets: ["operations-exporter:9464"]
        labels:
          environment: staging
          service: operations-exporter

  - job_name: blackbox-web
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets: ["http://web:3000/api/health/live"]
        labels:
          environment: staging
          service: web
          probe: liveness
      - targets: ["http://web:3000/api/health/ready"]
        labels:
          environment: staging
          service: web
          probe: readiness
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
